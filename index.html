<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b16"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="style.css"><title>SHOYEB Live Karaoke</title></head><body><div class="app"><header><div><b>SHOYEB</b><h1>Live Karaoke</h1><p>Live Mic • Voice FX • Echo • Reverb</p></div><span id="net">OFFLINE READY</span></header><section class="card"><canvas id="meter"></canvas><div class="buttons"><button id="start">🎤 START MIC</button><button id="stop" disabled>⏹ STOP</button></div><small id="msg">Headphones recommended.</small></section><section class="card"><h2>🎵 Karaoke Music</h2><label class="upload">＋ Choose MP3 / WAV / M4A<input id="file" type="file" accept="audio/*"></label><audio id="audio" controls></audio><label>Music volume <output id="mv">70%</output><input id="music" type="range" min="0" max="100" value="70"></label></section><section class="card"><h2>🎚️ Voice Changer</h2><label>Preset<select id="voice"><option value="normal">Normal</option><option value="deep">Deep Voice</option><option value="bright">Bright Voice</option><option value="radio">Radio</option><option value="robot">Robot</option><option value="telephone">Telephone</option></select></label><label>Mic volume <output id="micv">100%</output><input id="micvol" type="range" min="0" max="150" value="100"></label></section><section class="card"><h2>✨ Effects</h2><label>Echo <output id="ev">20%</output><input id="echo" type="range" min="0" max="75" value="20"></label><label>Reverb <output id="rv">25%</output><input id="reverb" type="range" min="0" max="80" value="25"></label><label>Delay <output id="dv">220 ms</output><input id="delay" type="range" min="60" max="700" value="220"></label><label>Master <output id="masterv">85%</output><input id="master" type="range" min="0" max="120" value="85"></label></section><section class="card"><h2>📱 Offline PWA</h2><p>Open once online after installation. The app shell is then cached for offline use.</p><button id="install" hidden>📲 Install App</button></section><footer>SHOYEB Live Karaoke</footer></div><script src="app.js"></script></body></html>
